[project]
name = "argus-pg"
version = "0.1.0"
description = "Postgres Index Validator"
authors = [
    {name = "Argus Team",email = "argus@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic (>=2.12.5,<3.0.0)",
    "docker (>=7.1.0,<8.0.0)",
    "psycopg[binary] (>=3.3.2,<4.0.0)",
    "google-genai (>=1.59.0,<2.0.0)",
]
packages = [{include = "argus", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLE"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff (>=0.14.13,<0.15.0)",
    "black (>=26.1.0,<27.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (requiring external resources like Docker)",
    "asyncio: marks tests as asyncio (handled by pytest-asyncio)",
]

[tool.poetry.scripts]
argus = "argus.cli:main"
